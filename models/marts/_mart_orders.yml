version: 2

models:
  - name: fact_orders
    description: "Une ligne par commande, avec paiements, articles et délai de livraison."
    columns:
      - name: order_id
        description: "Identifiant de la commande (grain du model)."
        data_tests:
          - unique
          - not_null
          - relationships:
             arguments:
               to: ref('stg_orders')
               field: order_id
      - name: customer_unique_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: customer_id
        description: "Identifiant du client."
        data_tests:
          - not_null
  - name: dim_customers
    description: "Dimension client : une ligne par personne réelle (customer_unique_id)."
    columns:
       - name: customer_unique_id
         description: "Identifiant unique de la personne. Les attributs (ville, état) viennent de sa commande la plus récente."
         data_tests:
           - unique
           - not_null
  - name: dim_products
    description: "table de dimension des produits par catégorie"
    columns:
       - name: product_id
         description: "Identifiant unique de chaque produit avec une ligne par produit"
         data_tests:
          - unique
          - not_null
  - name: dim_sellers
    description: "une table de dimension vendeur ayant Une ligne = un produit"
    columns:
     - name: seller_id
       data_tests:
        - unique
        - not_null
          
  
        

